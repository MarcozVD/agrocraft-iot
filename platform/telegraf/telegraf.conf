# Telegraf: suscriptor MQTT -> InfluxDB 2.
#   telemetry: un punto por mensaje, con la marca de tiempo del dispositivo y etiquetas class/device.
#   events:    comandos, acks, eventos y cambios de estado, tal como llegan (alimentan las anotaciones).

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  # Solo clases de la captura real; la simulación va aparte (más abajo)
  topics = ["agro/twin/+/telemetry", "agro/api/+/telemetry", "agro/dataset/+/telemetry", "agro/real/+/telemetry"]
  qos = 1
  client_id = "telegraf-telemetry-v2"   # v2: sin la suscripción vieja agro/+/+/telemetry (incluía la simulación)
  persistent_session = true            # con QoS 1 el bróker guarda lo que llegue si Telegraf se reinicia
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  name_override = "telemetry"
  topic_tag = ""
  data_format = "json"                 # solo campos numéricos: evita conflictos de tipo en InfluxDB
  json_time_key = "ts"
  json_time_format = "unix_ms"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "agro/+/+/telemetry"
    tags = "_/class/device/_"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["agro/+/+/cmd", "agro/+/+/ack", "agro/+/+/event", "agro/+/+/state", "agro/+/+/status"]
  qos = 1
  client_id = "telegraf-events"
  persistent_session = true
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  name_override = "events"
  topic_tag = ""
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "agro/+/+/+"
    tags = "_/class/device/channel"

# Granja de simulación (reloj acelerado): medición propia, nunca se mezcla con la captura real
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["agro/sim/+/telemetry"]
  qos = 1
  client_id = "telegraf-simulation"
  persistent_session = true
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  name_override = "simulation"
  topic_tag = ""
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "agro/sim/+/telemetry"
    tags = "_/class/device/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "agrocraft"
  bucket = "telemetry"
