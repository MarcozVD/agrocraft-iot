# Reglas de alerta de AgroCraft (Grafana Alerting).
# Patrón de cada regla: A = serie temporal por dispositivo (columnas _time, _value y etiqueta device),
# B = Reduce a un número por dispositivo, C = umbral. Así una regla genera una alerta por dispositivo.
# Anotación agro_cmd: comando que el servicio de control ejecuta cuando la alerta se dispara. Usa set_config
# (no set_actuator) para mover el actuador sin sacar al gemelo de control automático: así el propio
# gemelo lo apaga al volver al rango (lección del 11 nov: las ventilas quedaron abiertas en manual).
# Plantillas con .Labels / .Values (sin "$": en provisioning "$" se interpola desde el entorno y "$$"
# no se des-escapa en esta versión; lección del 11 nov).
apiVersion: 1

groups:
  - orgId: 1
    name: agrocraft
    folder: AgroCraft
    interval: 1m
    rules:
      - uid: agro-suelo-seco
        title: Suelo seco
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Humedad del suelo de {{ .Labels.device }} por debajo de 30 %: {{ printf \"%.1f\" .Values.B.Value }} %"
          agro_cmd: '{"class":"twin","device":"{{ .Labels.device }}","action":"set_config","params":{"auto":1}}'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: influx-agro
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r._field == "soil_pct")
                  |> filter(fn: (r) => r.device == "mc-parcela-a" or r.device == "mc-parcela-b")
                  |> group(columns: ["device"])
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: mean }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [30] } }]

      - uid: agro-estres-termico
        title: Estrés térmico en el invernadero
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Invernadero a {{ printf \"%.1f\" .Values.B.Value }} °C (umbral 32 °C): se abren las ventilas"
          agro_cmd: '{"class":"twin","device":"mc-invernadero","action":"set_config","params":{"vent":1,"auto":1}}'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: influx-agro
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r.device == "mc-invernadero" and r._field == "temp_c")
                  |> group(columns: ["device"])
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: mean }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [32] } }]

      - uid: agro-tanque-bajo
        title: Tanque bajo
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Tanque al {{ printf \"%.1f\" .Values.B.Value }} % (umbral 20 %): se enciende la bomba"
          agro_cmd: '{"class":"twin","device":"mc-tanque","action":"set_config","params":{"pump":1,"auto":1}}'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: influx-agro
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r.device == "mc-tanque" and r._field == "level_pct")
                  |> group(columns: ["device"])
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [20] } }]

      - uid: agro-intruso
        title: Intruso en la granja
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "{{ printf \"%.0f\" .Values.B.Value }} criatura(s) hostil(es) dentro de la cerca"
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: influx-agro
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r.device == "mc-seguridad" and r._field == "hostiles_near")
                  |> group(columns: ["device"])
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: max }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: agro-sin-datos
        title: Dispositivo sin datos
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ .Labels.device }} no envía datos hace {{ printf \"%.0f\" .Values.B.Value }} s"
        data:
          - refId: A
            relativeTimeRange: { from: 172800, to: 0 }
            datasourceUid: influx-agro
            model:
              refId: A
              # Segundos desde la última muestra de cada dispositivo (un punto por dispositivo).
              # phone-01 se excluye: solo envía mientras la app del celular está abierta.
              query: |
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r._field == "seq" and r.device != "phone-01")
                  |> group(columns: ["device"])
                  |> last()
                  |> map(fn: (r) => ({_time: r._time, device: r.device,
                                      _value: float(v: uint(v: now()) - uint(v: r._time)) / 1000000000.0}))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [1800] } }]

      - uid: agro-gemelo-degradado
        title: Gemelo degradado (TPS bajo)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "El servidor del gemelo corre a {{ printf \"%.1f\" .Values.B.Value }} TPS (normal: 20)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: influx-agro
            model:
              refId: A
              query: |
                from(bucket: "telemetry")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "telemetry" and r.device == "mc-server" and r._field == "tps")
                  |> group(columns: ["device"])
                  |> keep(columns: ["_time", "_value", "device"])
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: mean }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [15] } }]
