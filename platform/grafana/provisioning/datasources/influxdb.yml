apiVersion: 1

datasources:
  - name: InfluxDB-AgroCraft
    uid: influx-agro
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: agrocraft
      defaultBucket: telemetry
      timeInterval: 10s
    secureJsonData:
      token: $INFLUX_TOKEN
