# Bróker MQTT de AgroCraft. Sin acceso anónimo: cada dispositivo tiene usuario propio y ACL.
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# Red interna de Docker (no se publica a Internet): Telegraf, flota virtual, plugin de Minecraft
listener 1883

# MQTT sobre WebSocket; Caddy lo publica como wss://<host>/mqtt
listener 9001
protocol websockets

# El listener TLS 8883 se agrega en conf.d/tls.conf cuando existe el certificado (scripts/sync-certs.sh)
include_dir /mosquitto/config/conf.d

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
